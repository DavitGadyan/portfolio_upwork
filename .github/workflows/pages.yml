# Build the static export and deploy it to GitHub Pages.
#
# Works with zero configuration: the first run enables Pages (source "GitHub Actions") and serves the site at
# https://<owner>.github.io/<repo>/ with the matching base path.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   CUSTOM_DOMAIN     "davidgadyan.com" once DNS points at Pages: writes out/CNAME, base path becomes empty and
#                     SITE_URL defaults to https://<CUSTOM_DOMAIN>
#   SITE_URL          override the absolute site URL (rarely needed)
#   BASE_PATH         override the base path (rarely needed; "/" means empty)
#   VERIFY_STRICT_ES  "1" to fail the build on Spanish pages that look untranslated
#
# The build also runs scripts/verify-out.mjs, which fails if any contact route, social profile link or Toptal mention
# slips into the served pages (the site is linked from Upwork).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      VERIFY_STRICT_ES: ${{ vars.VERIFY_STRICT_ES }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Enables Pages with the "GitHub Actions" source on the first run, so no manual setup is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Resolve site URL and base path
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          BASE_PATH_VAR: ${{ vars.BASE_PATH }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$CUSTOM_DOMAIN" ]; then site="https://${CUSTOM_DOMAIN}"; base=""
          else site="https://${owner}.github.io/${repo}"; base="/${repo}"; fi
          [ -n "$SITE_URL_VAR" ] && site="$SITE_URL_VAR"
          if [ -n "$BASE_PATH_VAR" ]; then base="$BASE_PATH_VAR"; [ "$base" = "/" ] && base=""; fi
          echo "NEXT_PUBLIC_SITE_URL=${site%/}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "Site: ${site%/}  base path: '${base}'  custom domain: '${CUSTOM_DOMAIN}'"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next build type-checks the project itself; it must run before lint so the generated .next/types exist.
      - name: Build static export (type-check, content parity, image optimisation and the compliance scan)
        run: npm run build

      - name: Lint and unit tests
        run: |
          npm run lint
          npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
