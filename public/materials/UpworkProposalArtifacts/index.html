<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Proposal · David Gadyan</title>
<!--
  Private proposal viewer. Each job's diagram is stored next to this page as <id>/payload.json, encrypted with
  AES-256-GCM. The key travels only in the link fragment (#p=<id>&k=<key>), which browsers never send to a server, so
  the public repository and GitHub Pages hold ciphertext only. Contract: docs/upwork-proposal-artifacts.md.
-->
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f8; --surface: #ffffff; --line: #dde1e5; --fg: #14181c; --muted: #5d6670; --accent: #0f766e;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1215; --surface: #171b20; --line: #2a3038; --fg: #e8ebee; --muted: #98a2ad; --accent: #2dd4bf;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1215; --surface: #171b20; --line: #2a3038; --fg: #e8ebee; --muted: #98a2ad; --accent: #2dd4bf;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); display: flex; flex-direction: column; }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px;
    padding: 8px 16px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .bar .who { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .who span { color: var(--muted); font-weight: 400; }
  .bar .ttl { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar .ttl b { color: var(--accent); font-weight: 600; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; }
  .msg { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  .card { max-width: 440px; text-align: center; }
  .card h1 { font-size: 20px; margin: 0 0 8px; }
  .card p { margin: 0 0 16px; color: var(--muted); }
  .card a { color: var(--accent); }
  .loading { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="bar" id="bar" hidden>
  <div class="who">David Gadyan <span>· Proposal:</span> <span id="title-text"></span></div>
  <div class="ttl">Link expires in <b id="ttl"></b></div>
</header>
<main class="msg" id="msg">
  <div class="card">
    <h1 id="msg-title">Opening proposal…</h1>
    <p id="msg-text" class="loading">Decrypting in your browser.</p>
    <p id="msg-home" hidden><a href="../../">Visit the portfolio</a></p>
  </div>
</main>
<script>
// BEGIN-DECRYPT (also exercised by tests/unit/proposals.test.ts)
function b64urlToBytes(s) {
  s = String(s).replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function openPayload(payload, keyB64) {
  if (!payload || payload.v !== 1) throw new Error('unsupported');
  const raw = b64urlToBytes(keyB64);
  if (raw.length !== 32) throw new Error('bad key');
  const key = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64urlToBytes(payload.iv) }, key, b64urlToBytes(payload.ct));
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
// END-DECRYPT

(function () {
  const $ = (id) => document.getElementById(id);
  function show(title, text) {
    $('bar').hidden = true;
    const frame = document.querySelector('iframe');
    if (frame) frame.remove();
    $('msg').hidden = false;
    $('msg-title').textContent = title;
    $('msg-text').textContent = text;
    $('msg-text').classList.remove('loading');
    $('msg-home').hidden = false;
  }
  const PRIVATE = ['This link is private', 'The link is incomplete or was changed. Please open the exact link from the proposal message.'];
  const EXPIRED = ['This proposal link has expired', 'Proposal links stay open for 72 hours after they are sent.'];

  function left(ms) {
    const m = Math.max(0, Math.floor(ms / 60000));
    const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
    return d ? `${d}d ${String(h).padStart(2, '0')}h` : `${h}h ${String(mm).padStart(2, '0')}m`;
  }

  async function run() {
    const params = new URLSearchParams(location.hash.slice(1));
    const id = params.get('p') || '';
    const k = params.get('k') || '';
    if (!/^p-[a-z0-9]{6,32}$/.test(id) || !k) return show(...PRIVATE);
    if (!window.crypto?.subtle || typeof DecompressionStream === 'undefined') {
      return show('Please update your browser', 'This page needs a current version of Chrome, Edge, Firefox or Safari.');
    }
    let payload;
    try {
      const res = await fetch(`./${id}/payload.json`, { cache: 'no-store' });
      if (res.status === 404) return show(...EXPIRED);
      if (!res.ok) throw new Error(String(res.status));
      payload = await res.json();
    } catch {
      return show('Could not load the proposal', 'Please check your connection and reload the page.');
    }
    if (Date.parse(payload.expiresAt) <= Date.now()) return show(...EXPIRED);
    let doc;
    try { doc = await openPayload(payload, k); } catch { return show(...PRIVATE); }
    const expires = Date.parse(doc.expiresAt); // the encrypted copy is authoritative: it cannot be edited
    if (!(expires > Date.now())) return show(...EXPIRED);

    document.title = `${doc.title} · David Gadyan`;
    $('msg').hidden = true;
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads');
    frame.setAttribute('title', doc.title);
    frame.srcdoc = doc.html;
    document.body.appendChild(frame);
    if (doc.chrome !== false) {
      $('title-text').textContent = doc.title;
      $('bar').hidden = false;
    }
    const tick = () => {
      const ms = expires - Date.now();
      if (ms <= 0) { clearInterval(timer); return show(...EXPIRED); }
      $('ttl').textContent = left(ms);
    };
    const timer = setInterval(tick, 30000);
    tick();
  }
  window.addEventListener('hashchange', () => location.reload());
  run();
})();
</script>
</body>
</html>
